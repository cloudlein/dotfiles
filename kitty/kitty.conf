
# BACKGROUND TRANSPARENT
background_opacity 0.8

window_padding_width 10
window_margin_width 0

include generated/matugen.conf

# BEGIN_KITTY_FONTS
font_family      family="AnnotationM Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# CURSOR
cursor_shape underline
cursor_beam_thickness 1.5
cursor_blink_interval 0

# ENABLE LAYOUTS SPLIT
enabled_layouts splits,stack 

# SHORTCUTS FOR SPLITTING TO THE RIGHT (VSPLIT) AND DOWN (HSPLIT)
map ctrl+shift+d launch --location=vsplit --cwd=current
map ctrl+shift+s launch --location=hsplit --cwd=current

# NAVIGATING BETWEEN SPLITS USING ARROW KEYS
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

